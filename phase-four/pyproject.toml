[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decisionguard-phase-four"
version = "0.4.0"
description = "Offline durable authority and atomic local execution for agents"
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"
dependencies = []

[project.scripts]
decisionguard = "decisionguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

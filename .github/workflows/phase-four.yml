name: Phase four offline checks
on:
  push:
    paths: ['phase-four/**', '.github/workflows/phase-four.yml']
  pull_request:
    paths: ['phase-four/**', '.github/workflows/phase-four.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test offline runtime, concurrency, crash recovery and CLI
        working-directory: phase-four
        run: python -W error::ResourceWarning -m unittest discover -s tests -v

name: Phase eight offline checks
on:
  push:
    paths: ['phase-eight/**', 'start.py', '.github/workflows/phase-eight.yml']
  pull_request:
    paths: ['phase-eight/**', 'start.py', '.github/workflows/phase-eight.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Backend, worker, CLI and loopback HTTP checks
        working-directory: phase-eight
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Interface JavaScript syntax
        working-directory: phase-eight
        run: node --check src/decisionguard/web/app.js
      - name: Frozen synthetic evaluation matrix
        working-directory: phase-eight
        run: python evals/run.py --output local/ci-evaluation
      - name: Reproducible release and clean extraction
        working-directory: phase-eight
        run: |
          python scripts/build_release.py --output local/release.zip
          python -m zipfile -e local/release.zip local/extracted
          cd local/extracted/decisionguard-v1
          python start.py --help
          python run.py --help
          python -W error::ResourceWarning -m unittest discover -s tests -v

name: Phase seven offline checks
on:
  push:
    paths: ['phase-seven/**', '.github/workflows/phase-seven.yml']
  pull_request:
    paths: ['phase-seven/**', '.github/workflows/phase-seven.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Backend, worker, CLI and loopback HTTP checks
        working-directory: phase-seven
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Optional console JavaScript syntax
        working-directory: phase-seven
        run: node --check src/decisionguard/web/app.js
      - name: Frozen synthetic evaluation matrix
        working-directory: phase-seven
        run: python evals/run.py --output local/ci-evaluation

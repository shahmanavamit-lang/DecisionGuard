[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decisionguard-phase-one"
version = "0.1.0"
description = "Task-scoped authorization before synthetic agent tool effects"
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"
dependencies = []

[project.scripts]
decisionguard = "decisionguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
